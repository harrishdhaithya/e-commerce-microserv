# Local development infrastructure.
#
# Phase 1 needs Keycloak and nothing else. There is deliberately no database here -
# every service embeds its own H2 (see PLAN.md section 4). Kafka, Prometheus, Grafana
# and Jaeger arrive in Phase 3; adding them now would mean five containers you do not
# use yet.
#
# Run these from THIS directory (infra/), because `docker compose` only looks for a
# compose file in the current directory:
#
#   docker compose up -d          start
#   docker compose logs -f        follow
#   docker compose stop           pause, keeping the realm you built in the console
#   docker compose start          resume
#   docker compose down           remove the container - discards console changes,
#                                 so export your realm first (see volumes: below)
#
# From the repo root instead, point at the file:
#
#   docker compose -f infra/docker-compose.yml up -d
#
# That is safe rather than subtly broken: relative paths below resolve against this
# file's location, not your working directory. To avoid repeating the flag,
# `export COMPOSE_FILE=infra/docker-compose.yml` for the shell session.
#
# Version note: Keycloak's environment-variable names and management port have changed
# across majors (KEYCLOAK_ADMIN -> KC_BOOTSTRAP_ADMIN_*, health moved to port 9000).
# If something below does not behave, check the docs for the exact tag you pull rather
# than assuming these names are stable.

name: ecommerce-platform

services:
  keycloak:
    # Pin a real tag rather than :latest, so a rebuild months from now behaves the
    # same. Bump deliberately.
    image: quay.io/keycloak/keycloak:26.4
    container_name: ecommerce-keycloak

    command:
      # Development mode: HTTP allowed, no clustering, and an embedded database. Never
      # use start-dev for anything real.
      - start-dev
      # Import any realm JSON found in the mounted import directory, but only if that
      # realm does not already exist. Safe to leave on permanently.
      - --import-realm

    environment:
      # Admin console credentials. Fine to commit: this compose file only ever runs
      # locally, and start-dev is not production-capable anyway.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      # ---------------------------------------------------------------------------
      # The single most important line in this file.
      #
      # This fixes the issuer Keycloak stamps into every token to
      # http://localhost:8180/realms/ecommerce, regardless of which hostname the
      # caller used to reach it.
      #
      # Without it, a service running on the host sees an issuer of localhost:8180
      # while a service running inside Docker sees keycloak:8080 - and a resource
      # server rejects any token whose `iss` does not match its configured
      # issuer-uri byte for byte. The symptom is an opaque 401 invalid_token with
      # nothing useful in the message.
      #
      # Every service's issuer-uri must be exactly this value.
      # ---------------------------------------------------------------------------
      KC_HOSTNAME: http://localhost:8180

      # Internal (container-to-container) calls resolve against the same fixed
      # hostname above instead of being derived per request.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: false

      # Exposes /health/* and /metrics on the management port (9000).
      KC_HEALTH_ENABLED: true

    ports:
      # 8180 on the host because 8080 belongs to the API gateway from Phase 2.
      # Container-internal stays 8080.
      - "8180:8080"

    volumes:
      # Realm JSON goes here. Read-only: the container must never rewrite your
      # source of truth.
      - ./keycloak/import:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data
      #
      # There is deliberately NO volume for Keycloak's embedded H2 database.
      #
      # Mounting one at /opt/keycloak/data/h2 fails: that directory does not exist in
      # the image (Keycloak creates it at runtime), so Docker creates the mount point
      # as root-owned, and Keycloak - running as uid 1000 - cannot write to it. The
      # symptom is AccessDeniedException on keycloakdb.trace.db and a container that
      # will not start.
      #
      # Leaving it out is also the better workflow. Without a volume the database
      # lives in the container's writable layer, which survives `stop`/`start` and
      # `restart` - only `down` discards it. Combined with --import-realm, that makes
      # the committed realm JSON the single source of truth: any change made in the
      # admin console must be exported, or it is gone. That is the discipline you
      # want, and it is exactly what the Step 2 checkpoint tests.
      #
      # If you ever do need persistence across `down`, mount the PARENT directory
      # instead - `- keycloak-data:/opt/keycloak/data` - because that path does exist
      # in the image, so Docker copies its correct ownership into the new volume.

    healthcheck:
      # The Keycloak image is a minimal UBI build with no curl or wget, so this uses
      # bash's /dev/tcp instead. Health lives on the management port 9000, not 8080.
      #
      # Nothing depends on this yet, so delete it freely if it misbehaves. It starts
      # earning its keep in Phase 3 when other containers need `depends_on:
      # condition: service_healthy`.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      # Keycloak takes a while to boot; without this the container is marked
      # unhealthy before it has had a fair chance.
      start_period: 45s

    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Application services
  #
  # Build context is `..` - the repo root - because each service is a module in a
  # Maven reactor and cannot compile without the parent POM and common/. The
  # dockerfile path is therefore relative to the root too.
  # ---------------------------------------------------------------------------

  catalog-service:
    build:
      context: ..
      dockerfile: services/catalog-service/Dockerfile
    container_name: ecommerce-catalog
    ports:
      # Published so Swagger UI and the H2 console stay reachable from the host.
      - "8082:8082"
    volumes:
      # H2 lives in the container's /app/data. Without this volume the catalog would
      # be rebuilt from the seed migration every time the container is replaced.
      - catalog-data:/app/data
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Same split as customer-service: validate the issuer as the browser sees it,
      # fetch the signing keys over the compose network. Only the admin write
      # endpoints need these - browsing the catalog carries no token at all.
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/ecommerce
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  customer-service:
    build:
      context: ..
      dockerfile: services/customer-service/Dockerfile
    container_name: ecommerce-customer
    ports:
      - "8081:8081"
    volumes:
      - customer-data:/app/data
    environment:
      SPRING_PROFILES_ACTIVE: dev

      # ---------------------------------------------------------------------
      # The one genuinely tricky pair of settings in this file.
      #
      # A browser obtains its token from http://localhost:8180, so every token's
      # `iss` claim says localhost:8180 - and KC_HOSTNAME above guarantees that
      # regardless of who asks. The issuer this service validates against must
      # therefore be the localhost form.
      #
      # But inside this container, "localhost" is this container. Fetching the
      # signing keys from localhost:8180 would connect to nothing. The keys have
      # to come over the compose network, from keycloak:8080.
      #
      # Hence: validate the issuer as the browser sees it, fetch the keys as the
      # container sees it. Collapsing these into a single issuer-uri is the
      # classic way to get an opaque 401 invalid_token that takes an hour to
      # diagnose.
      # ---------------------------------------------------------------------
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/ecommerce
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs
    depends_on:
      keycloak:
        # Waits for the realm import to finish, not merely for the container to
        # exist - which is what the healthcheck above is for.
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  cart-service:
    build:
      context: ..
      dockerfile: services/cart-service/Dockerfile
    container_name: ecommerce-cart
    ports:
      - "8084:8084"
    volumes:
      - cart-data:/app/data
    environment:
      SPRING_PROFILES_ACTIVE: dev
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/ecommerce
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs
      # The first service-to-service call in this stack: cart reads product names and
      # prices from the catalog when a line is added, and re-checks them at checkout.
      CATALOG_SERVICE_URI: http://catalog-service:8082
    depends_on:
      keycloak:
        condition: service_healthy
      catalog-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    container_name: ecommerce-gateway
    ports:
      - "8080:8080"
    environment:
      # Service addresses on the compose network. The same jar runs locally against
      # localhost defaults, so nothing needs reconfiguring to debug from an IDE.
      CATALOG_SERVICE_URI: http://catalog-service:8082
      CUSTOMER_SERVICE_URI: http://customer-service:8081
      CART_SERVICE_URI: http://cart-service:8084
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/ecommerce
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs
    depends_on:
      keycloak:
        condition: service_healthy
      catalog-service:
        condition: service_started
      customer-service:
        condition: service_started
      cart-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      # Only this service builds from frontend/ - the SPA has no dependency on the
      # Maven reactor.
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ecommerce-frontend
    ports:
      # 4200 on the host even though nginx listens on 80, because the ecom-web
      # client's registered redirect URIs are http://localhost:4200/*. Changing
      # this port means editing the realm JSON to match.
      - "4200:80"
    depends_on:
      # nginx forwards /api to the gateway now, so that is its only dependency.
      api-gateway:
        condition: service_started
    restart: unless-stopped

  # Phase 3 additions, for reference. Do not uncomment until you need them.
  #
  #   kafka        - Redpanda is a lighter, Kafka-API-compatible option locally
  #   mailpit      - catch-all SMTP with a web inbox, so notification-service can
  #                  "send" mail with no way to reach a real person
  #   prometheus   - scrapes each service's /actuator/prometheus
  #   grafana      - dashboards over Prometheus
  #   jaeger       - OpenTelemetry trace collector and UI

volumes:
  keycloak-data:
  cart-data:
  catalog-data:
  customer-data:
