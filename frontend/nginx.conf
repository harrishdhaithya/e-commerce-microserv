server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Replaces the Angular dev-server proxy (frontend/proxy.conf.json) with the same
    # path-based routing. Service names resolve over the compose network.
    #
    # Phase 2 collapses all of this into one `proxy_pass http://api-gateway:8080`.

    location /api/customers {
        proxy_pass http://customer-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass the bearer token through untouched.
        proxy_set_header Authorization $http_authorization;
    }

    location /api/products {
        proxy_pass http://catalog-service:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/categories {
        proxy_pass http://catalog-service:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Single-page app routing. A deep link like /account or /callback is not a file on
    # disk, so without this fallback nginx returns 404 and the OIDC redirect - which
    # lands on /callback - breaks.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed bundles are immutable; index.html must never be cached or a deploy would
    # keep serving the old app.
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
