server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # One route, not three.
    #
    # Before the gateway existed this file duplicated per-service routing, and so did
    # frontend/proxy.conf.json - two copies of the same topology, drifting apart. Now
    # nginx serves static files and forwards everything under /api to the gateway,
    # which owns the routing table.
    location /api {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Single-page app routing. A deep link like /account or /callback is not a file on
    # disk, so without this fallback nginx 404s and the OIDC redirect breaks.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed bundles are immutable; index.html must never be cached or a deploy would
    # keep serving the old app.
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
