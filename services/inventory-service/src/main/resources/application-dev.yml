spring:
  datasource:
    url: jdbc:h2:file:./data/inventory;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  flyway:
    # Schema, then demo stock. Tests load db/migration only.
    locations: classpath:db/migration,classpath:db/seed

  h2:
    console:
      # http://localhost:8083/h2-console - dev profile only.
      enabled: true
      path: /h2-console

  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.ecommerce: DEBUG
