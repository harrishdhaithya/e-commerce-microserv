spring:
  datasource:
    # File mode, not mem: a cart you were mid-way through building survives the
    # dozens of restarts you will do each day (PLAN.md section 4).
    url: jdbc:h2:file:./data/cart;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  flyway:
    # No db/seed. Carts are created on demand by shoppers, not loaded from fixtures.
    locations: classpath:db/migration

  h2:
    console:
      # http://localhost:8084/h2-console
      # JDBC URL jdbc:h2:file:./data/cart, user sa, no password.
      # Dev profile only - never enable this anywhere reachable.
      enabled: true
      path: /h2-console

  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.ecommerce: DEBUG
