spring:
  application:
    name: catalog-service

  profiles:
    # Running the jar or `mvn spring-boot:run` with no profile set lands in dev.
    default: dev

  jpa:
    hibernate:
      # Flyway owns the schema. 'validate' fails startup on entity/schema drift
      # instead of silently reshaping tables - see PLAN.md section 4.
      ddl-auto: validate
    # Keeps the Hibernate session from staying open through view rendering, which
    # hides N+1 queries behind lazy loads in the serialization layer.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    # Schema only. The dev profile adds db/seed on top.
    locations: classpath:db/migration

  datasource:
    hikari:
      # Deliberately small. Six services with fat pools is how you exhaust a real
      # database later; start as you mean to continue.
      maximum-pool-size: 5

  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri is what the `iss` claim must equal; jwk-set-uri is where this
          # process fetches the signing keys. They differ inside Docker, where
          # "localhost" is the container rather than the host - see
          # docs/architecture.md.
          #
          # Note that reads here are public, so most requests never carry a token at
          # all. These settings only matter for the admin write endpoints.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ecommerce}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/ecommerce/protocol/openid-connect/certs}

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    # The correlation ID from common-web, on every line.
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-no-correlation-id}] %logger{36} - %msg%n"
