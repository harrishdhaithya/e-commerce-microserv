spring:
  datasource:
    # In-memory here: tests want a fresh database, and this is what makes the suite
    # run in seconds rather than minutes.
    url: jdbc:h2:mem:catalog-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  flyway:
    # Schema only, no seed data. Every test builds the exact rows it asserts on.
    locations: classpath:db/migration

  jpa:
    hibernate:
      # Same validate as production: a broken migration fails the test suite, which
      # is the whole point of running Flyway in tests.
      ddl-auto: validate
