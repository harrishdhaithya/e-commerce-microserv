spring:
  application:
    name: customer-service

  profiles:
    # Running the jar or `mvn spring-boot:run` with no profile set lands in dev.
    default: dev

  jpa:
    hibernate:
      # Flyway owns the schema. 'validate' fails startup on entity/schema drift
      # instead of silently reshaping tables - see PLAN.md section 4.
      ddl-auto: validate
    # Keeps the Hibernate session from staying open through view rendering, which
    # hides N+1 queries behind lazy loads in the serialization layer.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    # Schema only. The dev profile adds db/seed on top.
    locations: classpath:db/migration

  datasource:
    hikari:
      # Deliberately small. Six services with fat pools is how you exhaust a real
      # database later; start as you mean to continue.
      maximum-pool-size: 5

  security:
    oauth2:
      resourceserver:
        jwt:
          # These two are split on purpose, and the reason only becomes obvious once
          # this service runs in a container.
          #
          # issuer-uri is what the `iss` claim must equal, byte for byte. Tokens are
          # minted for a browser, which reaches Keycloak at localhost:8180 - and
          # KC_HOSTNAME pins Keycloak to stamp exactly that, whoever asks.
          #
          # jwk-set-uri is where THIS PROCESS fetches the signing keys. On the host
          # that is also localhost:8180, but inside Docker "localhost" is the
          # container itself, so it has to be http://keycloak:8080 instead.
          #
          # Setting both means Spring fetches keys over the internal address while
          # still validating the issuer against the public one. Setting only
          # issuer-uri would make Spring derive the JWKS URL from it and fail in
          # Docker; setting only jwk-set-uri would skip issuer validation entirely.
          #
          # Using jwk-set-uri also removes the discovery call at startup, so the
          # service boots whether or not Keycloak is up.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ecommerce}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/ecommerce/protocol/openid-connect/certs}

server:
  # 8081 per the port map in docs/architecture.md. 8083 is inventory-service.
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    # The correlation ID from common-web, on every line.
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-no-correlation-id}] %logger{36} - %msg%n"
