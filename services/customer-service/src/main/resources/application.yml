spring:
  application:
    name: customer-service

  profiles:
    # Running the jar or `mvn spring-boot:run` with no profile set lands in dev.
    default: dev

  jpa:
    hibernate:
      # Flyway owns the schema. 'validate' fails startup on entity/schema drift
      # instead of silently reshaping tables - see PLAN.md section 4.
      ddl-auto: validate
    # Keeps the Hibernate session from staying open through view rendering, which
    # hides N+1 queries behind lazy loads in the serialization layer.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    # Schema only. The dev profile adds db/seed on top.
    locations: classpath:db/migration

  datasource:
    hikari:
      # Deliberately small. Six services with fat pools is how you exhaust a real
      # database later; start as you mean to continue.
      maximum-pool-size: 5

  security:
    oauth2:
      resourceserver:
        jwt:
          # Must match the `iss` claim in Keycloak's tokens byte for byte, which is
          # why infra/docker-compose.yml pins KC_HOSTNAME to this same value. A
          # mismatch surfaces as an opaque 401 invalid_token with no useful detail.
          #
          # Spring fetches the JWKS from here once and caches the public keys, so
          # validation is offline: Keycloak being down blocks new logins but not
          # authenticated API calls.
          issuer-uri: http://localhost:8180/realms/ecommerce

server:
  # 8081 per the port map in docs/architecture.md. 8083 is inventory-service.
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    # The correlation ID from common-web, on every line.
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-no-correlation-id}] %logger{36} - %msg%n"
